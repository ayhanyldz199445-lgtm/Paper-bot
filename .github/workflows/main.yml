name: Paper Bot
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python main.py
      - run: |
          git config --global user.email "bot@bot.com"
          git config --global user.name "Paper Bot"
          git add sonuc.txt || echo "yok"
          git commit -m "update" || echo "commit yok"
          git push || echo "push yok"
